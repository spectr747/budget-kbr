<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Бюджеты МСУ КБР — вход</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--fg:#1E293B;--muted:#64748B;--line:#E2E8F0;--inc:#2563EB;--bad:#DC2626;
  --shadow:0 2px 8px rgba(30,41,59,.08);--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:root[data-theme="dark"]{--bg:#0F172A;--card:#1E293B;--fg:#E2E8F0;--muted:#94A3B8;--line:#334155;--inc:#60A5FA;--bad:#F87171;
  --shadow:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
body{display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:380px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:28px 24px;
  display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;margin:0;line-height:1.3;text-wrap:balance}
p.sub{margin:-6px 0 4px;color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--inc);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--inc);border:0;border-radius:8px;padding:11px 12px;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
</style>
</head>
<body>
<form id="login-form" autocomplete="on" novalidate>
  <h1>Бюджеты органов местного самоуправления КБР</h1>
  <p class="sub">Войдите, чтобы открыть дашборд</p>
  <label for="login">Логин<input id="login" name="username" autocomplete="username" required></label>
  <label for="password">Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="err" role="alert"></p>
  <button id="submit" type="submit">Войти</button>
</form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
// тема по умолчанию тёмная, как у дашборда
let theme = "dark"; try { theme = localStorage.getItem("kbr-theme-v2") || "dark"; } catch (e) {}
document.documentElement.setAttribute("data-theme", theme);
async function deriveKey(login, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(login + "\n" + password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function openDashboard(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const form = document.getElementById("login-form"), err = document.getElementById("err"), btn = document.getElementById("submit");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const login = document.getElementById("login").value.trim(), password = document.getElementById("password").value;
  if (!login || !password) { err.textContent = "Введите логин и пароль."; return; }
  err.textContent = ""; btn.disabled = true; btn.textContent = "Проверяем…";
  try { await openDashboard(await deriveKey(login, password)); }
  catch (x) {
    err.textContent = "Неверный логин или пароль. Проверьте раскладку и Caps Lock.";
    btn.disabled = false; btn.textContent = "Войти";
    document.getElementById("password").select();
  }
});
